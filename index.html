<style>
/* Layout: editing suite — tool rail | asset panel | player | inspector over a multi-track timeline; phones get a CapCut-style bottom toolbar with sheets. Single dark look by choice. */
:root{
  --bg:#0C0F14; --surface:#141922; --surface-2:#1A202B; --surface-3:#242C3A; --line:#2A3343;
  --fg:#E9EDF3; --muted:#8C96A8; --dim:#5E687A;
  --accent:#FFB547; --accent-ink:#1E1404; --accent-soft:rgba(255,181,71,.14);
  --cut:#FF5D5D; --c-text:#8AA8FF; --c-audio:#4CC9A6; --c-fx:#B794FF; --c-ov:#FF8A7A;
  --ui:"Readex Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:10px;font-weight:500;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.wide{width:100%}
.lang{position:relative;display:flex;align-items:center;gap:6px;height:38px;padding:0 6px 0 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);flex:none}
.lang select{appearance:none;-webkit-appearance:none;background:transparent;border:0;padding:0 18px 0 2px;font-weight:500;cursor:pointer;font-size:14px}
.lang::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.lang option{background:var(--surface-2)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo{width:36px;height:36px;display:block}
.bname{font-weight:700;font-size:19px;letter-spacing:-.01em}
.bname b{font-weight:300;color:var(--muted);margin-left:5px}

/* ---------- HOME ---------- */
#home{height:100%;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.h-top{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:10px;direction:ltr;padding-block:14px}
.h-top .sp{flex:1}
.h-wrap{max-width:1160px;margin:0 auto;padding-bottom:48px;display:flex;flex-direction:column;gap:30px}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}
.hcard{position:relative;border-radius:22px;padding:22px;min-height:180px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;text-align:start;overflow:hidden;border:1px solid var(--line);transition:transform .15s}
.hcard:hover{transform:translateY(-2px)}
.hcard h2{margin:0;font-size:24px;font-weight:700;text-wrap:balance}
.hcard p{margin:0;font-size:13.5px;line-height:1.5;max-width:44ch;opacity:.8}
.hcard .big{position:absolute;top:20px;inset-inline-start:22px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center}
.hcard .big .i{width:26px;height:26px}
.hcard.new{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.hcard.new .big{background:rgba(30,20,4,.12)}
.hcard.auto{background:radial-gradient(circle at 85% 15%,rgba(183,148,255,.35),transparent 55%),radial-gradient(circle at 10% 100%,rgba(76,201,166,.25),transparent 55%),var(--surface)}
.hcard.auto .big{background:rgba(183,148,255,.18);color:var(--c-fx)}
.hcard .tags{position:absolute;top:24px;inset-inline-end:22px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:55%}
.hcard .tags span{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted)}
.sect{display:flex;flex-direction:column;gap:12px}
.sect-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sect-t h3{margin:0;font-size:17px;font-weight:600}
.sect-t small{color:var(--dim);font-size:12.5px}
.tpl-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.tpl{display:flex;flex-direction:column;gap:8px;text-align:start;border-radius:14px}
.tpl canvas{width:100%;height:auto;aspect-ratio:4/5;border-radius:14px;display:block;background:var(--surface);border:1px solid var(--line);max-width:100%}
.tpl:hover canvas{border-color:var(--accent)}
.tpl b{font-weight:500;font-size:13.5px}
.tpl small{color:var(--dim);font-size:11.5px;margin-top:-6px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pcard{position:relative;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line);text-align:start}
.pcard:hover{border-color:var(--accent)}
.pthumb{aspect-ratio:16/10;background:#000 center/contain no-repeat;max-width:100%}
.pmeta{padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pmeta b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta small{color:var(--dim);font:500 11.5px var(--mono)}
.pdel{position:absolute;top:8px;inset-inline-end:8px;width:32px;height:32px;border-radius:9px;background:rgba(12,15,20,.75);display:grid;place-items:center;color:var(--muted);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pdel:hover{color:#ff8a8a}
.pdel.arm{background:var(--cut);color:#fff}
.empty-proj{color:var(--dim);background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:26px;text-align:center;line-height:1.6}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hcard{min-height:150px}.hcard .tags{display:none}}

/* ---------- EDITOR ---------- */
.app{height:100%;display:grid;gap:8px;
  grid-template-columns:70px 296px minmax(0,1fr) 312px;
  grid-template-rows:auto minmax(0,1fr) 316px;
  grid-template-areas:"top top top top" "rail lib stage insp" "tl tl tl tl";
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;min-height:0}
.top{grid-area:top;display:flex;align-items:center;gap:10px;direction:ltr;min-width:0}
.icbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.icbtn:hover{background:var(--surface-2)}
.pname{min-width:0;flex:0 1 240px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;color:var(--muted);text-overflow:ellipsis}
.pname:hover,.pname:focus{border-color:var(--line);color:var(--fg);outline:none;background:var(--surface)}
.savest{font-size:12px;color:var(--dim);white-space:nowrap}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

.rail{grid-area:rail;display:flex;flex-direction:column;gap:2px;padding:6px;overflow-y:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 2px;border-radius:10px;color:var(--muted);font-size:10.5px;line-height:1.15;text-align:center}
.rbtn:hover{background:var(--surface-2);color:var(--fg)}
.rbtn.on{background:var(--accent-soft);color:var(--accent)}
.rbtn .i{width:20px;height:20px}

.lib{grid-area:lib;display:flex;flex-direction:column;overflow:hidden}
.insp{grid-area:insp;display:flex;flex-direction:column;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 14px 6px;min-height:46px}
.ph .badge{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ph .badge .i{width:15px;height:15px}
.ph h4{margin:0;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sheet-x{display:none;width:32px;height:32px;border-radius:9px;place-items:center;color:var(--muted);flex:none}
.sheet-x:hover{background:var(--surface-2)}
.pbody{flex:1;overflow:auto;padding:8px 14px 18px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.tabs{display:flex;gap:2px;margin:4px 12px 2px;padding:3px;background:var(--bg);border-radius:10px;border:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;height:30px;border-radius:7px;font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 10px}
.tab.on{background:var(--surface-3);color:var(--fg);font-weight:500}

.sec-h{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
:root[dir=rtl] .sec-h,:root[dir=rtl] .grp{letter-spacing:0;font-size:12px}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:500;border-top:1px solid var(--line);padding-top:12px}
.import{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.import:hover{border-color:var(--accent);background:var(--accent-soft)}
.import strong{font-weight:600}
.import small{color:var(--muted);font-size:12px;line-height:1.4}
.import .i{width:26px;height:26px;color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbtn{display:flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:4px 8px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;text-align:center}
.qbtn:hover{background:var(--surface-3)}
.qbtn.accent{background:var(--accent-soft);border-color:rgba(255,181,71,.4);color:var(--accent)}
.qbtn.rec{background:rgba(255,93,93,.15);border-color:var(--cut);color:#ff9a9a}
.qbtn.rec .i{animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.mitem{position:relative;display:flex;flex-direction:column;border-radius:9px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);text-align:start}
.mitem:hover{border-color:var(--accent)}
.mthumb{aspect-ratio:16/10;background:#000 center/cover no-repeat;position:relative;max-width:100%}
.mthumb.aud{background:linear-gradient(135deg,#123a33,#0f2420) center/100% 60% no-repeat}
.mdur{position:absolute;bottom:4px;right:4px;font:500 10px var(--mono);background:rgba(0,0,0,.65);padding:1px 5px;border-radius:4px}
.mname{padding:5px 7px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.pip{position:absolute;top:4px;right:4px;height:22px;padding:0 7px;border-radius:6px;background:rgba(12,15,20,.8);font-size:10.5px;font-weight:600;color:var(--c-ov);display:flex;align-items:center}
.pip:hover{background:var(--c-ov);color:#1a0905}
.empty{color:var(--dim);text-align:center;padding:16px 8px;font-size:13px;line-height:1.55}
.alist{display:flex;flex-direction:column;gap:6px}
.arow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:start}
.arow:hover{border-color:var(--accent)}
.arow .dot{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;color:#0c0f14}
.arow .meta{flex:1;min-width:0;display:flex;flex-direction:column}
.arow .meta b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .meta small{color:var(--dim);font:500 11px var(--mono)}
.arow .plus{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.emogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.emo{aspect-ratio:1;border-radius:10px;font-size:26px;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.emo:hover{background:var(--surface-2)}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cgrid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ccard{display:flex;flex-direction:column;gap:4px;border-radius:10px;padding:3px;border:1.5px solid transparent;text-align:center;font-size:11.5px;color:var(--muted);min-width:0}
.ccard canvas{width:100%;height:auto;border-radius:7px;display:block;background:#000;max-width:100%}
.ccard span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.ccard:hover{color:var(--fg)}
.tgt{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px}
.tgt b{color:var(--fg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.trgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.trb{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;text-align:start;min-width:0}
.trb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trb.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.trb .i{width:16px;height:16px}
.fld{display:flex;flex-direction:column;gap:7px}
.fl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted)}
.fl output{font:500 12px var(--mono);color:var(--fg);font-variant-numeric:tabular-nums}
.fl .kfd{color:var(--accent);font-size:11px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--accent) var(--p,50%),var(--surface-3) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);margin-top:-6px;box-shadow:0 1px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--surface-3)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:0}
:root[dir=rtl] input[type=range]{direction:ltr}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:44px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;padding:0 6px;white-space:nowrap}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;min-height:30px;cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw .knob{width:38px;height:22px;border-radius:22px;background:var(--surface-3);position:relative;flex:none;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw input:checked+.knob{background:var(--accent)}
.sw input:checked+.knob::after{transform:translateX(16px);background:var(--accent-ink)}
.sw input:focus-visible+.knob{outline:2px solid var(--accent);outline-offset:2px}
.colrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.colrow input[type=color]{width:36px;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:2px;cursor:pointer}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
textarea{width:100%;min-height:74px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:15px;line-height:1.4}
.txtin{width:100%;height:36px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 10px}
select.txtin{appearance:auto}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.abtn{flex:1 1 auto;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.abtn:hover{background:var(--surface-3)}
.abtn.warn{color:#ff8a8a}
.abtn.accent{background:var(--accent-soft);color:var(--accent);border-color:rgba(255,181,71,.4)}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.fontgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:250px;overflow:auto}
.fontb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);text-align:start;min-width:0}
.fontb .sm{font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;max-width:100%}
.fontb .fnm{font-size:10.5px;color:var(--dim);font-family:var(--ui)}
.fontb.on{border-color:var(--accent);background:var(--accent-soft)}
.ratio{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ratio button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px}
.ratio button i{display:block;border:2px solid currentColor;border-radius:3px}
.ratio button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* stage */
.stage-area{grid-area:stage;display:flex;flex-direction:column;overflow:hidden}
.stage-wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:14px;background:radial-gradient(ellipse at center,#161c26 0%,#0e1218 70%)}
#cv{display:block;background:#000;border-radius:3px;box-shadow:0 18px 50px rgba(0,0,0,.55);touch-action:none;max-width:100%;max-height:100%}
.estage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.estage button{pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 28px;border-radius:18px;background:rgba(20,25,34,.85);border:1.5px dashed var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.estage button:hover{border-color:var(--accent)}
.estage .i{width:34px;height:34px;color:var(--accent)}
.estage b{font-weight:600}
.estage small{color:var(--muted)}
.recpill{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--cut);color:#fff;font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:99px}
.recpill i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.transport{display:flex;align-items:center;gap:4px;padding:6px 10px;border-top:1px solid var(--line);direction:ltr}
.tbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--fg);flex:none}
.tbtn:hover:not(:disabled){background:var(--surface-2)}
.tbtn.on{color:var(--accent)}
.play{width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg)}
.play:hover{background:#fff!important}
.play .i{width:19px;height:19px;fill:currentColor;stroke:none}
.tc{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg);padding:0 8px;white-space:nowrap}
.tc span{color:var(--dim)}
.tsp{flex:1}
.kfbtn .i{fill:none}
.kfbtn.on .i{fill:var(--accent)}

/* timeline */
.tl{grid-area:tl;display:flex;flex-direction:column;overflow:hidden}
.tl-bar{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--line);direction:ltr;overflow-x:auto;scrollbar-width:none;flex:none}
.tl-bar::-webkit-scrollbar{display:none}
.tl-bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.tl-bar .lbl{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:9px;font-size:12.5px;white-space:nowrap;flex:none}
.tl-bar .lbl:hover:not(:disabled){background:var(--surface-2)}
.zoom{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.zoom input{width:110px}
.tl-body{flex:1;display:flex;min-height:0;direction:ltr}
.tl-heads{width:44px;flex:none;border-right:1px solid var(--line);overflow:hidden}
.tl-heads .h{display:grid;place-items:center;color:var(--muted);border-bottom:1px solid var(--line)}
.tl-heads .h .i{width:16px;height:16px}
.tl-scroll{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
.tl-inner{position:relative;min-height:100%}
.ruler{height:26px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6;background-color:var(--surface);cursor:ew-resize;touch-action:none;background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-repeat:repeat-x;background-position-y:18px;background-size:12px 8px}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--dim);padding-left:4px;font:500 10px var(--mono);color:var(--muted);pointer-events:none;line-height:16px}
.track{position:relative;border-bottom:1px solid var(--line)}
.track.main{background:rgba(255,255,255,.015)}
.addtr{position:absolute;top:50%;transform:translateY(-50%);height:24px;padding:0 10px;border-radius:7px;border:1px dashed var(--line);color:var(--dim);font-size:11.5px;white-space:nowrap}
.addtr:hover{border-color:var(--accent);color:var(--accent)}
.addmain{position:absolute;top:8px;bottom:8px;width:52px;border-radius:8px;background:var(--fg);color:var(--bg);display:grid;place-items:center}
.addmain .i{width:22px;height:22px;stroke-width:2.4}
.blk{position:absolute;border-radius:7px;overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:flex;align-items:center;gap:6px;padding:0 12px;white-space:nowrap;font-size:11.5px}
.blk .txt{overflow:hidden;text-overflow:ellipsis;min-width:0;unicode-bidi:plaintext}
.blk.v{top:7px;bottom:7px;background:#222 center/auto 100% repeat-x;border:1.5px solid rgba(255,255,255,.12);align-items:flex-end;padding-bottom:4px}
.blk.v .txt{font-weight:500;text-shadow:0 1px 3px #000}
.blk.v .txt span{font:500 10px var(--mono);opacity:.75;margin-left:5px}
.blk.t{background:rgba(138,168,255,.18);border:1.5px solid rgba(138,168,255,.5);color:#d8e1ff}
.blk.o{background:rgba(255,138,122,.16) left center/auto 100% repeat-x;border:1.5px solid rgba(255,138,122,.55);color:#ffd9d3}
.blk.o .txt{background:rgba(12,15,20,.55);padding:1px 6px;border-radius:5px}
.blk.f{background:rgba(183,148,255,.18);border:1.5px solid rgba(183,148,255,.5);color:#e6dbff}
.blk.a{background:rgba(76,201,166,.15) center/100% 70% no-repeat;border:1.5px solid rgba(76,201,166,.5);color:#c4f2e4;align-items:flex-start;padding-top:2px}
.blk.sel{border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent),0 0 18px rgba(255,181,71,.25);z-index:3}
.blk.dragging{opacity:.85;z-index:5;cursor:grabbing;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.hd{position:absolute;top:0;bottom:0;width:12px;z-index:2;cursor:ew-resize;display:grid;place-items:center;padding:0}
.hd::after{content:"";width:3px;height:44%;border-radius:2px;background:rgba(255,255,255,.75)}
.hd[data-s=l]{left:0}.hd[data-s=r]{right:0}
.blk:not(.sel) .hd::after{opacity:.3}
.kfm{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;transform:rotate(45deg);background:var(--accent);border:1px solid #1e1404;pointer-events:none;z-index:1}
.bt{position:absolute;bottom:2px;width:2px;height:6px;margin-left:-1px;background:rgba(255,255,255,.55);border-radius:1px;pointer-events:none}
.trmark{position:absolute;width:20px;height:20px;margin-left:-10px;margin-top:-10px;border-radius:6px;background:var(--surface);border:1.5px solid var(--line);z-index:4;display:grid;place-items:center;color:var(--muted);padding:0}
.trmark .i{width:12px;height:12px}
.trmark.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.playhead{position:absolute;top:0;bottom:0;left:0;width:2px;margin-left:-1px;background:var(--cut);z-index:10;pointer-events:none}
.playhead .knob{position:absolute;top:0;left:-7px;width:16px;height:18px;background:var(--cut);clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);pointer-events:auto;cursor:ew-resize;touch-action:none}
.dropmark{position:absolute;width:3px;background:var(--accent);border-radius:2px;z-index:8;pointer-events:none;box-shadow:0 0 10px var(--accent)}

.bbar{display:none;grid-area:bar;gap:2px;overflow-x:auto;scrollbar-width:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.bbar::-webkit-scrollbar{display:none}
.bb{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;border-radius:10px;font-size:10.5px;color:var(--muted);line-height:1.1;text-align:center}
.bb .i{width:21px;height:21px;color:var(--fg)}
.bb.on{color:var(--accent);background:var(--accent-soft)}
.bb.on .i{color:var(--accent)}
.bb.back{min-width:44px;border-inline-end:1px solid var(--line);border-radius:10px 0 0 10px}
.bb.warn .i{color:#ff8a8a}

/* modals */
.veil{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(580px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 6px}
.m-head h2{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
.m-body{padding:10px 20px 20px;display:flex;flex-direction:column;gap:14px}
.x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--surface-2);color:var(--fg)}
.prog{height:8px;border-radius:8px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .2s}
.ex-meta{display:flex;justify-content:space-between;font:500 12px var(--mono);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.kv b{color:var(--fg);font-weight:500}
.kv kbd{font:500 11.5px var(--mono);background:var(--surface-3);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:3px 7px;color:var(--fg);justify-self:start;direction:ltr}
#exVideo{width:100%;max-height:46vh;border-radius:10px;background:#000;display:block}
.tut-art{height:170px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden;background:radial-gradient(circle at 30% 20%,rgba(255,181,71,.28),transparent 55%),radial-gradient(circle at 80% 90%,rgba(183,148,255,.22),transparent 50%),var(--surface-2)}
.tut-art .i{width:60px;height:60px;color:var(--accent);stroke-width:1.4}
.tut-art .stepno{position:absolute;top:12px;inset-inline-start:14px;font:500 12px var(--mono);color:var(--muted)}
.tut-t{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.tut-d{color:var(--muted);line-height:1.7;margin:0;font-size:14.5px;max-width:62ch}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:7px;background:var(--surface-3);transition:width .2s,background .2s}
.dots i.on{width:22px;background:var(--accent)}
.nav{display:flex;gap:8px;align-items:center}
.nav .sp{flex:1}
.pickzone{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1.5px dashed var(--line);text-align:start;width:100%}
.pickzone:hover{border-color:var(--accent)}
.pickzone .i{width:26px;height:26px;color:var(--accent)}
.pickzone b{display:block;font-weight:600}
.pickzone small{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);font-weight:500;padding:10px 16px;border-radius:12px;z-index:80;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none;z-index:-1}
#pool video,#pool audio{width:2px;height:2px}
.dropveil{position:fixed;inset:0;z-index:60;background:rgba(255,181,71,.12);border:3px dashed var(--accent);display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--accent);pointer-events:none}

@media (max-width:1180px){.app{grid-template-columns:64px 256px minmax(0,1fr) 284px}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 206px auto;grid-template-areas:"top" "stage" "tl" "bar";gap:6px;padding-block:6px}
  .app{padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
  .rail{display:none}
  .bbar{display:flex}
  .lib,.insp{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));height:min(56vh,500px);z-index:30;border-radius:18px 18px 0 0;transform:translateY(130%);transition:transform .25s ease;box-shadow:0 -20px 50px rgba(0,0,0,.55);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .lib.open,.insp.open{transform:none}
  .sheet-x{display:grid}
  .bname b,.pname,.savest{display:none}
  .btn .bl{display:none}
  .btn.primary .bl{display:inline}
  .btn{padding:0 11px}
  .stage-wrap{padding:8px}
  .transport{padding:3px 6px;gap:0}
  .play{width:40px;height:40px}
  .zoom input{width:80px}
  input,select,textarea{font-size:16px}
  .cgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .libgrid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}
@media (max-width:440px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.hide-xs{display:none!important}.tc{font-size:12px;padding:0 4px}.tc span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

s1t:['مرحباً بك في Klipp Studio','Welcome to Klipp Studio','Velkommen til Klipp Studio'],s1d:['استوديو مونتاج كامل على طريقة CapCut للماك والآيفون والآيباد. مشاريعك تُحفظ تلقائياً على جهازك.','A complete CapCut-style editing studio for Mac, iPhone and iPad. Your projects save automatically on your device.','Et komplett redigeringsstudio i CapCut-stil for Mac, iPhone og iPad. Prosjektene lagres automatisk på enheten.'],
s2t:['١. ابدأ مشروعاً','1. Start a project','1. Start et prosjekt'],s2d:['من الصفحة الرئيسية: «مشروع جديد» لاختيار ملفاتك، أو «مونتاج تلقائي» ليصنع التطبيق الفيديو بنفسه على إيقاع الموسيقى، أو ابدأ من قالب جاهز.','From the home screen: “New project” to pick your files, “Auto edit” to have the app cut a video to the music for you, or start from a template.','Fra startsiden: «Nytt prosjekt» for å velge filer, «Autoredigering» for å la appen klippe en video i takt med musikken, eller start fra en mal.'],
s3t:['٢. الخط الزمني','2. The timeline','2. Tidslinjen'],s3d:['المسار الرئيسي للفيديو في الوسط، وفوقه مسارات الطبقات والنصوص والمؤثرات، وتحته الصوت. اسحب أي عنصر لتحريكه، واسحب حافتيه لقصه، واضغط المسطرة لتحريك المؤشر الأحمر. قرّب بإصبعين أو بشريط التكبير.','The main video track is in the middle, overlays, text and effects above it, sound below. Drag anything to move it, drag its edges to trim, tap the ruler to move the red playhead. Pinch or use the zoom slider.','Hovedsporet er i midten, overlegg, tekst og effekter over, lyd under. Dra for å flytte, dra kantene for å trimme, trykk på linjalen for å flytte spillehodet. Knip eller bruk zoom.'],
s4t:['٣. الأدوات','3. Tools','3. Verktøy'],s4d:['على الماك تجد الأدوات في الشريط الأيسر، وعلى الآيفون في الشريط السفلي: وسائط، صوت، نص، ملصقات، مؤثرات، انتقالات، فلاتر، ضبط، وإطار. عند اختيار عنصر يتحول الشريط السفلي إلى أدوات ذلك العنصر.','On Mac the tools are in the left rail, on iPhone in the bottom bar: media, audio, text, stickers, effects, transitions, filters, adjust and canvas. When you select something, the bottom bar switches to tools for that item.','På Mac ligger verktøyene til venstre, på iPhone nederst: medier, lyd, tekst, klistremerker, effekter, overganger, filtre, juster og lerret. Når du velger noe, viser linjen verktøy for det elementet.'],
s5t:['٤. طبقات وإطارات مفتاحية','4. Overlays and keyframes','4. Overlegg og nøkkelbilder'],s5d:['ضع صورة أو فيديو فوق الفيديو الرئيسي بزر «فوق». حرّكه وكبّره ودوّره على الشاشة، واختر قناعاً أو وضع دمج، أو أزل الشاشة الخضراء. زر ◆ يضيف إطاراً مفتاحياً لتحريك الطبقة أو النص عبر الزمن.','Put a photo or video on top of the main video with “Over”. Move, resize and rotate it on the preview, choose a mask or blend mode, or remove a green screen. The ◆ button adds a keyframe to animate overlays and text over time.','Legg et bilde eller en video oppå hovedvideoen med «Over». Flytt, skaler og roter i forhåndsvisningen, velg maske eller blandingsmodus, eller fjern grønn skjerm. ◆-knappen legger til nøkkelbilder for animasjon.'],
s6t:['٥. نصوص ومؤثرات','5. Text and effects','5. Tekst og effekter'],s6d:['٢٩ خطاً عربياً ولاتينياً مع أنماط جاهزة وحركات دخول وخروج ومتكررة، وترجمة سريعة من سطور مكتوبة. ٢٤ مؤثراً مثل التشويش والاهتزاز وVHS والثلج والقلوب، و٢٥ فلتراً و١٣ انتقالاً.','29 Arabic and Latin fonts with ready styles, in, out and loop animations, plus quick subtitles from typed lines. 24 effects such as glitch, shake, VHS, snow and hearts, 25 filters and 13 transitions.','29 arabiske og latinske skrifter med ferdige stiler, inn-, ut- og løkkeanimasjoner, og raske undertekster. 24 effekter som glitch, risting, VHS, snø og hjerter, 25 filtre og 13 overganger.'],
s7t:['٦. صوت وإيقاع','6. Sound and beat','6. Lyd og takt'],s7d:['أضف موسيقى مجانية من داخل التطبيق أو ملفاتك أو سجّل تعليقاً صوتياً. يحلل التطبيق إيقاع الموسيقى، وزر «اقطع المقاطع على الإيقاع» يجعل كل انتقال يقع على النبضة.','Add free music from inside the app, your own files, or record a voiceover. The app analyses the beat, and “Cut clips to the beat” lands every cut on a beat.','Legg til gratis musikk fra appen, dine egne filer, eller ta opp voiceover. Appen analyserer takten, og «Klipp i takt» legger hvert klipp på et slag.'],

let dragDepth=0,dv=null;

window.addEventListener('dragover',e=>{if([...(e.dataTransfer?.types||[])].includes('Files'))e.preventDefault()});
window.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth&&dv){dv.remove();dv=null}});
window.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;if(dv){dv.remove();dv=null}const f=e.dataTransfer?[...e.dataTransfer.files]:[];if(!f.length)return;
 if(!$('#veil').hidden&&$('.pickzone')){aeFiles=f;renderAE();return}if(!P){const p=newProject();p.name=nextName();await startProject(p)}importFiles(f,'main')});
document.addEventListener('keydown',e=>{const tg=e.target;if(tg.closest&&tg.closest('input:not([type=range]):not([type=checkbox]),textarea,select'))return;
 if(!$('#veil').hidden){if(e.key==='Escape'&&!exporting)closeModal();return}if(!P)return;const mod=e.metaKey||e.ctrlKey,k=e.key.toLowerCase();
 if(e.code==='Space'){e.preventDefault();toggle()}else if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(mod&&k==='y'){e.preventDefault();redo()}else if(mod&&k==='d'){e.preventDefault();dupSel()}
 else if(!mod&&k==='s'){e.preventDefault();splitAt()}else if(!mod&&k==='k'){e.preventDefault();toggleKey()}else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delSel()}
 else if(e.key==='Escape'){select(null)}else if(e.key==='ArrowLeft'){e.preventDefault();pause();seek(t-(e.shiftKey?1:1/30))}else if(e.key==='ArrowRight'){e.preventDefault();pause();seek(t+(e.shiftKey?1:1/30))}
 else if(e.key==='Home'){pause();seek(0)}else if(e.key==='End'){pause();seek(total())}});
function applyLang(){const html=document.documentElement;html.lang=lang==='no'?'nb':lang;html.dir=lang==='ar'?'rtl':'ltr';$$('.langSel').forEach(s=>s.value=lang);
 $$('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));$$('[data-it]').forEach(e=>{e.title=T(e.dataset.it);e.setAttribute('aria-label',T(e.dataset.it))});
 if(P){syncNameUI();refreshAll(true)}else renderHome();if(!$('#veil').hidden&&$('.tut-art'))renderTut();if(!$('#veil').hidden&&$('.pickzone'))renderAE()}
$$('.langSel').forEach(s=>s.addEventListener('change',e=>{lang=e.target.value;LS.set('klipp.lang',lang);applyLang()}));
window.addEventListener('beforeunload',()=>{if(P)saveProject()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&P)saveProject()});


/* ================================================================ boot */
new ResizeObserver(()=>{if(P){fitCanvas();renderTimeline();requestRender()}}).observe($('#stageWrap'));
window.addEventListener('resize',()=>{if(!isMobile())closeSheets();if(P)renderBar()});
setRangeFill($('#zoomIn'));
DB.open().then(()=>{applyLang();if(!LS.get('klipp.tut2',0))setTimeout(openTut,500)});
</script>
</body></html>
